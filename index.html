<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SARA SHAPAN — Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#book{position:relative;filter:drop-shadow(0 18px 35px rgba(0,0,0,.45))}
.page{position:absolute;top:0;width:50%;height:100%;background:#fff;overflow:hidden;transition:transform .75s cubic-bezier(.2,.7,.2,1);backface-visibility:hidden}
.left{left:0;transform-origin:right center}
.right{left:50%;transform-origin:left center}
.page img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.flipped{transform:rotateY(-180deg)}
button{position:fixed;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.2);color:#fff;font-size:28px;width:44px;height:60px;border-radius:8px;cursor:pointer;z-index:20}
#prev{left:10px}
#next{right:10px}
button:hover{background:rgba(255,255,255,.4)}
#counter{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.75;z-index:20}
</style>
</head>
<body>
<div id="app"><div id="book"></div></div>
<button id="prev">‹</button>
<button id="next">›</button>
<div id="counter"></div>

<script>
const N = 20, book = document.getElementById('book'), counter = document.getElementById('counter');
let pages = [], current = 0;

function image(n){
  let x = document.createElement('img');
  x.src = 'pages/page-' + String(n).padStart(2,'0') + '.jpg';
  x.alt = 'Portfolio page ' + n;
  return x;
}

function fit(){
  let w = Math.min(innerWidth - 70, 1400);
  let h = Math.min(innerHeight - 70, 900);
  
  // ضبط نسبة الارتفاع إلى العرض لصفحتين متجاورتين
  if (w / 1.414 > h) {
    w = h * 1.414;
  } else {
    h = w / 1.414;
  }
  
  book.style.width = w + 'px';
  book.style.height = h + 'px';
}

function build(){
  book.innerHTML = '';
  pages = [];
  for(let i = 0; i < N; i++){
    let p = document.createElement('div');
    p.className = 'page ' + (i % 2 ? 'right' : 'left');
    p.style.zIndex = N - i;
    p.appendChild(image(i + 1));
    book.appendChild(p);
    pages.push(p);
  }
  fit();
  update();
}

function update(){
  counter.textContent = Math.min(current + 1, N) + ' / ' + N;
}

function next(){
  if(current < N){
    pages[current].classList.add('flipped');
    current++;
    update();
  }
}

function prev(){
  if(current > 0){
    current--;
    pages[current].classList.remove('flipped');
    update();
  }
}

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
});
addEventListener('resize', fit);
build();
</script>
</body>
</html>
